name: Windows desktop installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild SQLite for the bundled Node runtime
        run: npm rebuild better-sqlite3

      - name: Build installer
        run: npm run desktop:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke-test the packaged server
        shell: pwsh
        run: |
          $app = (Resolve-Path "release\win-unpacked\resources\app").Path
          $env:MAYA_DB_PATH = Join-Path $env:RUNNER_TEMP "maya-smoke.db"
          $env:NODE_ENV = "production"
          $env:HOSTNAME = "127.0.0.1"
          $env:PORT = "3987"
          $env:NEXT_TELEMETRY_DISABLED = "1"
          $process = Start-Process -FilePath "$app\node.exe" `
            -ArgumentList "$app\server\server.js" `
            -WorkingDirectory "$app\server" `
            -PassThru -NoNewWindow
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $response = Invoke-WebRequest -UseBasicParsing `
                  -Uri "http://127.0.0.1:3987/api/health" -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) {
              throw "The packaged server did not become ready."
            }
            Write-Host "Packaged server health check passed."
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: maya-windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Publish the release download
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/Maya-Setup.exe
          make_latest: true
          generate_release_notes: true
