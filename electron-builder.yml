appId: com.maya.voice
productName: Maya
copyright: Copyright © 2026 Maya contributors

directories:
  output: release
  buildResources: build

files:
  - desktop/**
  - package.json
  - "!node_modules/**"

extraResources:
  - from: desktop-resources
    to: app

asar: true
npmRebuild: false

win:
  icon: desktop/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Maya-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Maya

mac:
  icon: desktop/icon.png
  target:
    - dir
  category: public.app-category.productivity
