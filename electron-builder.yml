appId: com.maya.voice
productName: Maya
copyright: Copyright © 2026 Maya contributors

directories:
  output: release
  buildResources: build

files:
  - desktop/**
  - package.json
  - "!node_modules/**"

extraResources:
  - from: desktop-resources
    to: app

asar: true
npmRebuild: false

win:
  icon: desktop/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # A fixed name keeps one permanent download link:
  # https://github.com/<owner>/<repo>/releases/latest/download/Maya-Setup.exe
  artifactName: Maya-Setup.${ext}

nsis:
  # One click: no wizard pages, no admin prompt, installs for the current
  # user and opens Maya when it finishes. Setup continues inside the app.
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Maya
  deleteAppDataOnUninstall: false

mac:
  icon: desktop/icon.png
  target:
    - dir
  category: public.app-category.productivity
